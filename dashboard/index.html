<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TARS</title>
<style>
:root{--bg:#070b12;--card:#0c141f;--line:#123049;--cy:#2bc9ff;--tx:#c9d6e2;--dim:#5b7183;--green:#2ecc71;--amber:#f1c40f;--blue:#3498db;--purple:#8e44ad;--red:#e74c3c;--grey:#7f8c8d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 "Segoe UI",system-ui,sans-serif;padding:26px;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.012) 2px 4px)}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:16px}
h1{font-size:30px;letter-spacing:14px;color:#eaf6ff;font-weight:300;text-shadow:0 0 18px rgba(43,201,255,.45)}
.sub{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--dim);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grey);box-shadow:0 0 10px currentColor;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45}}
#clock{font:300 34px/1 Consolas,monospace;color:#eaf6ff;text-shadow:0 0 14px rgba(43,201,255,.35)}
#date{color:var(--dim);text-align:right;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--cy);margin-bottom:12px}
.big{font-size:17px}
.dim{color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0}
input[type=range]{flex:1;accent-color:var(--cy);height:4px}
.val{width:34px;text-align:right;font-family:Consolas,monospace;color:var(--cy)}
.x{color:var(--dim);cursor:pointer;padding:0 5px;font-size:15px;line-height:1}
.x:hover{color:var(--red)}
.feed{font-family:Consolas,monospace;font-size:12px;max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.feed .you{color:#7fe3a0}
.feed .tars{color:var(--cy)}
.feed time{color:var(--dim);margin-right:7px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:2px 9px;margin:3px 4px 3px 0;font-size:12px;color:var(--tx);cursor:default}
.chip:hover{border-color:var(--cy);color:var(--cy)}
a{color:var(--cy);text-decoration:none}
a:hover{text-shadow:0 0 8px rgba(43,201,255,.6)}
ul{list-style:none}
li{margin:5px 0}
.count{font:300 40px/1 Consolas,monospace;color:#eaf6ff;text-shadow:0 0 14px rgba(43,201,255,.35)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<header>
  <div>
    <h1>TARS</h1>
    <div class="sub"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
  </div>
  <div>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
</header>

<div class="grid">
  <div class="card"><h2>Today</h2>
    <div class="big" id="weather"><span class="dim">fetching weather…</span></div>
  </div>
  <div class="card"><h2>Timers &amp; Reminders</h2><div id="timers" class="dim">None running.</div></div>
  <div class="card"><h2>Personality</h2><div id="sliders"></div></div>
  <div class="card"><h2>Activity</h2><div class="feed" id="feed"><span class="dim">Quiet so far.</span></div></div>
  <div class="card"><h2>Skills</h2><div id="skills"></div></div>
  <div class="card"><h2>Brain</h2>
    <div class="row"><span class="count" id="noteCount">0</span><span class="dim">memories<br>in the vault</span></div>
    <ul id="recentNotes"></ul>
  </div>
  <div class="card"><h2>Smart Home</h2><div class="dim">Not connected yet — coming in Phase 5.</div></div>
</div>

<script>
const COLORS={standby:"var(--grey)",listening:"var(--green)",thinking:"var(--amber)",
              speaking:"var(--blue)",asleep:"var(--purple)",offline:"var(--red)",starting:"var(--grey)"};
const LABELS={standby:'Standby — say "Hey TARS"',listening:"Listening…",thinking:"Thinking…",
              speaking:"Speaking…",asleep:"Asleep",offline:"Offline",starting:"Starting…"};
let sliderNames="";
let online=false;
let lastSettings={};

function setOnline(ok){
  online=ok;
  const box=document.getElementById("sliders");
  box.style.opacity=ok?1:.35;
  box.querySelectorAll("input").forEach(i=>i.disabled=!ok);
}

function esc(s){const d=document.createElement("span");d.textContent=s;return d.innerHTML}

function render(s){
  const dot=document.getElementById("statusDot");
  dot.style.background=COLORS[s.status]||"var(--grey)";
  dot.style.color=dot.style.background;
  document.getElementById("statusText").textContent=LABELS[s.status]||s.status;

  document.getElementById("weather").innerHTML=s.weather?esc(s.weather):'<span class="dim">fetching weather…</span>';

  const t=document.getElementById("timers");
  if(!s.timers.length) t.innerHTML='<span class="dim">None running.</span>';
  else t.innerHTML=s.timers.map(x=>{
    const mins=Math.max(0,Math.round((new Date(x.due)-Date.now())/60000));
    const when=mins<120?mins+" min":new Date(x.due).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    return `<div class="row"><span>${esc(x.label||"timer")}</span><span class="val" style="width:auto">${when}</span></div>`;
  }).join("");

  const names=Object.keys(s.settings).join(",");
  const box=document.getElementById("sliders");
  if(names!==sliderNames){
    sliderNames=names;
    box.innerHTML=Object.entries(s.settings).map(([n,v])=>
      `<div class="row"><span style="width:92px">${esc(n.replaceAll("_"," "))}</span>
       <input type="range" min="0" max="100" value="${v}" data-name="${esc(n)}">
       <span class="val">${v}</span>
       <span class="x" data-name="${esc(n)}" title="Remove this setting">&times;</span></div>`).join("");
    box.querySelectorAll(".x").forEach(x=>{
      x.onclick=()=>{
        if(!online) return;
        if(confirm(`Remove the "${x.dataset.name.replaceAll("_"," ")}" setting? This can't be undone from here.`))
          fetch("/api/settings",{method:"POST",
            body:JSON.stringify({name:x.dataset.name,remove:true})}).then(tick);
      };
    });
    box.querySelectorAll("input").forEach(inp=>{
      inp.oninput=()=>{inp.nextElementSibling.textContent=inp.value};
      inp.onchange=()=>{
        fetch("/api/settings",{method:"POST",
          body:JSON.stringify({name:inp.dataset.name,value:+inp.value})})
        .catch(()=>{  // offline: snap back so it never lies
          inp.value=lastSettings[inp.dataset.name];
          inp.nextElementSibling.textContent=inp.value;
        });
      };
    });
  }else{
    box.querySelectorAll("input").forEach(inp=>{
      if(document.activeElement!==inp){inp.value=s.settings[inp.dataset.name];
        inp.nextElementSibling.textContent=inp.value}
    });
  }

  const feed=document.getElementById("feed");
  if(s.log.length){
    feed.innerHTML=s.log.map(e=>{
      const cls=e.kind==="heard"?"you":"tars";
      const who=e.kind==="heard"?"YOU":"TARS";
      return `<div class="${cls}"><time>${e.t.slice(11,16)}</time>${who}: ${esc(e.text)}</div>`;
    }).join("");
    feed.scrollTop=feed.scrollHeight;
  }

  document.getElementById("skills").innerHTML=s.skills.map(k=>
    `<span class="chip" title="${esc(k.desc)} (added ${k.added})">${esc(k.name)}</span>`).join("");

  document.getElementById("noteCount").textContent=s.brain.count;
  document.getElementById("recentNotes").innerHTML=s.brain.recent.map(n=>
    `<li><a href="${n.uri}">${esc(n.name)}</a></li>`).join("");
}

async function tick(){
  try{
    const r=await fetch("/api/state");
    const s=await r.json();
    lastSettings=s.settings;
    render(s);
    setOnline(true);
  }catch(e){
    document.getElementById("statusText").textContent="Offline — start TARS.bat, sliders are locked";
    document.getElementById("statusDot").style.background="var(--red)";
    setOnline(false);
  }
}
function clock(){
  const now=new Date();
  document.getElementById("clock").textContent=
    now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  document.getElementById("date").textContent=
    now.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
setInterval(tick,2000); tick();
setInterval(clock,1000); clock();
</script>
</body>
</html>
