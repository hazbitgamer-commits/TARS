<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TARS — Camera</title>
<style>
body{margin:0;background:#04060c;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font:13px "Segoe UI",sans-serif;color:#c9d6e2}
h1{font-size:16px;letter-spacing:8px;font-weight:300;color:#eaf6ff;
  text-shadow:0 0 16px rgba(43,201,255,.5);margin:18px 0 4px}
.live{color:#ff4d6e;font-size:11px;letter-spacing:3px;margin-bottom:14px}
.live::before{content:"●";margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
img{max-width:92vw;max-height:78vh;border:1px solid #123049;border-radius:12px;
  box-shadow:0 0 40px rgba(43,201,255,.15)}
.note{color:#5b7183;font-size:11px;margin-top:12px}
</style>
</head>
<body>
<h1>TARS CAMERA</h1>
<div class="live">LIVE — LOCAL ONLY</div>
<img src="/camera/stream" alt="camera feed"
     onerror="this.alt='Camera busy or unavailable — close other apps using it and refresh.'">
<div class="note">This feed never leaves the PC. Close the tab to release the camera.</div>
</body>
</html>
